<!DOCTYPE html>
<html>
<head>
  <title>jhm</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    /* ===== Layout ===== */

    .layout {
      display: flex;
      height: 100vh;
      background: #111;
      color: #eee;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      background: #111;
      color: #eee;
    }

    .sidebar {
      width: 200px;
      border-left: 1px solid #444;
      background: #1a1a1a;
      padding: 10px;
    }

    /* ===== Messages ===== */

    #messages {
      background: #000;
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #444;
    }

    #messages li {
      padding: 4px 6px;
      color: #ddd;
    }

    .input-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    #users {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    input, button {
      background: #222;
      color: #eee;
      border: 1px solid #555;
    }

    input::placeholder {
      color: #888;
    }

    button:hover {
      background: #333;
    }

    /* ===== Username overlay ===== */

    #username-overlay {
      position: fixed;
      inset: 0;
      background: black;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    
    #username-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .username-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .username-box h2 {
      margin: 0;
    }

    .username-box input,
    .username-box button {
      padding: 10px;
      font-size: 16px;
      width: 200px;
    }
  </style>
</head>

<body>

  <!-- Username screen -->
  <div id="username-overlay">
    <div class="username-box">
      <h2>Enter Username</h2>
      <input type="text" id="username-input" placeholder="Username" />
      <button onclick="submitUsername()">Enter</button>
    </div>
  </div>


  <!-- Layout -->
  <div class="layout">

    <!-- Chat -->
    <div class="chat">
      <h1>uugwemubwem</h1>
      <h2>hecho por matrixstar656_5</h2>

      <ul id="messages"></ul>

      <div class="input-row">
        <input id="message" autocomplete="off" />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Online</h3>
      <ul id="users"></ul>
    </div>

  </div>


  <!-- ===== JS ===== -->

  <script>
    const socket = io();
    let username = '';

    socket.on('connect', () => {
      if (username) {
        socket.emit('join', username);
      }
    });
    
    function submitUsername() {
      const input = document.getElementById('username-input');
      const overlay = document.getElementById('username-overlay');
      const name = input.value.trim();

      if (name) {
        username = name;
        socket.emit('join', username);
        overlay.classList.add('hidden');
      }
    }

    function playPing() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = 900;

      gain.gain.value = 0.1;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    }
    function sendMessage() {
      const input = document.getElementById('message');
      const text = input.value.trim();

      if (text !== '') {
        socket.send(username + ': ' + text);
        input.value = '';
      }
    }

    // Receive chat messages
    socket.on('message', function(msg) {
      const messages = document.getElementById('messages');
      const item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });

    // Receive user list
    socket.on('user_list', function(list) {
      const users = document.getElementById('users');
      users.innerHTML = '';

      list.forEach(u => {
        const li = document.createElement('li');
        li.textContent = u;
        users.appendChild(li);
      });
    });

    socket.on('user_joined', function() {
      playPing();
    });

    // Enter to send message
    document.getElementById('message').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Enter to submit username
    document.getElementById('username-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        submitUsername();
      }
    });
  </script>

</body>
</html>
